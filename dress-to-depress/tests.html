// ═══ SCORING FUNCTIONS (extracted from game) ═══
function getItemNames(outfitOpts) {
  const names = [];
  if (HATS[outfitOpts.hat].name !== 'None') names.push(HATS[outfitOpts.hat].name);
  names.push(TOPS[outfitOpts.top].name);
  names.push(BOTTOMS[outfitOpts.bottom].name);
  names.push(SHOES[outfitOpts.shoes].name);
  if (ACCESSORIES[outfitOpts.accessory].name !== 'None') names.push(ACCESSORIES[outfitOpts.accessory].name);
  return names;
}

function getItemStyles(outfitOpts) {
  const styles = [];
  const items = [HATS[outfitOpts.hat], TOPS[outfitOpts.top], BOTTOMS[outfitOpts.bottom], SHOES[outfitOpts.shoes], ACCESSORIES[outfitOpts.accessory]];
  items.forEach(item => { if (item.style) styles.push(item.style); });
  return styles;
}

function calcStyleMismatch(outfitOpts) {
  const styles = new Set(getItemStyles(outfitOpts));
  const SCORES = [0, 0, 5, 12, 22, 30];
  return SCORES[Math.min(styles.size, 5)] || 0;
}

function getItemColors(outfitOpts) {
  const colors = [];
  const items = [
    { def: HATS[outfitOpts.hat], colorIdx: outfitOpts.hatColor },
    { def: TOPS[outfitOpts.top], colorIdx: outfitOpts.topColor },
    { def: BOTTOMS[outfitOpts.bottom], colorIdx: outfitOpts.bottomColor },
    { def: SHOES[outfitOpts.shoes], colorIdx: outfitOpts.shoesColor },
    { def: ACCESSORIES[outfitOpts.accessory], colorIdx: outfitOpts.accessoryColor },
  ];
  items.forEach(({ def, colorIdx }) => {
    if (!def.color) return;
    if (def.color === 'variable') {
      const cp = COLOR_PALETTE[colorIdx];
      if (cp) colors.push(cp.hue);
    } else {
      const r = (def.color >> 16) & 0xff;
      const g = (def.color >> 8) & 0xff;
      const b = def.color & 0xff;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      if (max - min < 30) colors.push(-1);
      else {
        let h = 0;
        if (max === r) h = ((g - b) / (max - min)) * 60;
        else if (max === g) h = (2 + (b - r) / (max - min)) * 60;
        else h = (4 + (r - g) / (max - min)) * 60;
        if (h < 0) h += 360;
        colors.push(h);
      }
    }
  });
  return colors;
}

function calcColorClash(outfitOpts) {
  const hues = getItemColors(outfitOpts).filter(h => h >= 0);
  if (hues.length < 2) return 0;
  let score = 0;
  for (let i = 0; i < hues.length; i++) {
    for (let j = i + 1; j < hues.length; j++) {
      let dist = Math.abs(hues[i] - hues[j]);
      if (dist > 180) dist = 360 - dist;
      if (dist > 120) score += 5;
      else if (dist > 80) score += 3;
    }
  }
  const uniqueHueGroups = new Set(hues.map(h => Math.floor(h / 60)));
  if (uniqueHueGroups.size >= 4) score += 8;
  return Math.min(30, score);
}

function calcThemeScore(outfitOpts, theme) {
  let score = 0;
  const styles = getItemStyles(outfitOpts);
  styles.forEach(s => {
    if (theme.inappropriate.includes(s)) score += 7;
    if (theme.appropriate.includes(s)) score -= 4;
  });
  const names = getItemNames(outfitOpts);
  let comboComment = null;
  theme.bonusCombos.forEach(combo => {
    if (combo.items.every(item => names.includes(item))) {
      score += combo.bonus;
      comboComment = combo.comment;
    }
  });
  return { score: Math.max(0, Math.min(40, score)), comboComment };
}

function calcTotalScore(outfitOpts, theme) {
  const styleMismatch = calcStyleMismatch(outfitOpts);
  const colorClash = calcColorClash(outfitOpts);
  const { score: themeScore, comboComment } = calcThemeScore(outfitOpts, theme);
  const total = styleMismatch + colorClash + themeScore;
  return { total, styleMismatch, colorClash, themeScore, comboComment };
}

function getStars(score) {
  if (score >= 81) return 5;
  if (score >= 61) return 4;
  if (score >= 41) return 3;
  if (score >= 21) return 2;
  return 1;
}

section('Bot System');

const BOT_NAMES = ['Bella Disastro', 'Sir Wrinkleton', 'Missy Mishmash'];

test('3 bots defined', () => {
  assertEqual(BOT_NAMES.length, 3);
});

test('Bot names are unique', () => {
  assertEqual(BOT_NAMES.length, new Set(BOT_NAMES).size);
});

function generateRandomOutfit() {
  return {
    hat: Math.floor(Math.random() * HATS.length),
    top: Math.floor(Math.random() * TOPS.length),
    bottom: Math.floor(Math.random() * BOTTOMS.length),
    shoes: Math.floor(Math.random() * SHOES.length),
    accessory: Math.floor(Math.random() * ACCESSORIES.length),
    hatColor: Math.floor(Math.random() * COLOR_PALETTE.length),
    topColor: Math.floor(Math.random() * COLOR_PALETTE.length),
    bottomColor: Math.floor(Math.random() * COLOR_PALETTE.length),
    shoesColor: Math.floor(Math.random() * COLOR_PALETTE.length),
    accessoryColor: Math.floor(Math.random() * COLOR_PALETTE.length),
  };
}

test('generateRandomOutfit returns valid outfit', () => {
  const o = generateRandomOutfit();
  assert(o.hat >= 0 && o.hat < HATS.length, 'hat index valid');
  assert(o.top >= 0 && o.top < TOPS.length, 'top index valid');
  assert(o.bottom >= 0 && o.bottom < BOTTOMS.length, 'bottom index valid');
  assert(o.shoes >= 0 && o.shoes < SHOES.length, 'shoes index valid');
  assert(o.accessory >= 0 && o.accessory < ACCESSORIES.length, 'accessory index valid');
});

test('Random outfit has valid color indices', () => {
  const o = generateRandomOutfit();
  assert(o.hatColor >= 0 && o.hatColor < COLOR_PALETTE.length);
  assert(o.topColor >= 0 && o.topColor < COLOR_PALETTE.length);
  assert(o.bottomColor >= 0 && o.bottomColor < COLOR_PALETTE.length);
  assert(o.shoesColor >= 0 && o.shoesColor < COLOR_PALETTE.length);
  assert(o.accessoryColor >= 0 && o.accessoryColor < COLOR_PALETTE.length);
});

test('Random outfit is scorable', () => {
  const o = generateRandomOutfit();
  const result = calcTotalScore(o, THEMES[0]);
  assert(result.total >= 0, 'Score should be non-negative');
  assert(result.total <= 100, 'Score should be <= 100');
});

test('Bot outfits produce varied scores', () => {
  const scores = [];
  for (let i = 0; i < 20; i++) {
    const o = generateRandomOutfit();
    scores.push(calcTotalScore(o, THEMES[0]).total);
  }
  const unique = new Set(scores);
  assert(unique.size > 1, 'Multiple random outfits should produce varied scores');
});

test('Bot rating of player is 1-5 based on score', () => {
  // Low score = low rating
  const lowRating = Math.max(1, Math.min(5, Math.ceil(10 / 20)));
  assertEqual(lowRating, 1);
  // High score = high rating
  const highRating = Math.max(1, Math.min(5, Math.ceil(90 / 20)));
  assertEqual(highRating, 5);
  // Mid score
  const midRating = Math.max(1, Math.min(5, Math.ceil(50 / 20)));
  assertEqual(midRating, 3);
});

test('Leaderboard sorts by score descending', () => {
  const entries = [
    { name: 'A', score: 30 },
    { name: 'B', score: 80 },
    { name: 'C', score: 50 },
  ];
  entries.sort((a, b) => b.score - a.score);
  assertEqual(entries[0].name, 'B');
  assertEqual(entries[1].name, 'C');
  assertEqual(entries[2].name, 'A');
});

test('Final leaderboard totals are correct', () => {
  const botRoundScores = [40, 60, 50, 70, 55];
  const total = botRoundScores.reduce((a, b) => a + b, 0);
  assertEqual(total, 275);
});

test('getItemNames works with random outfit', () => {
  const o = generateRandomOutfit();
  const names = getItemNames(o);
  assert(names.length >= 3, 'Should have at least 3 item names');
  assert(names.length <= 5, 'Should have at most 5 item names');
});

const passed = _tests.filter(t => t.passed).length;
const failed = _tests.filter(t => !t.passed).length;
const total = _tests.length;

const summary = document.getElementById('summary');
summary.className = 'summary ' + (failed === 0 ? 'pass' : 'fail');
summary.textContent = passed + ' passed, ' + failed + ' failed (' + total + ' total)';

const results = document.getElementById('results');
_tests.forEach(t => {
  const div = document.createElement('div');
  div.className = t.passed ? 'pass' : 'fail';
  div.textContent = (t.passed ? '✓ ' : '✗ ') + t.name + (t.error ? ' — ' + t.error : '');
  results.appendChild(div);
});
