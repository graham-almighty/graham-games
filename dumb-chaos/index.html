<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dumb Chaos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@400;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #101014; color: #fff; font-family: 'Cinzel', serif; overflow: hidden; }
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: linear-gradient(180deg, #202018, #111114); border-bottom: 2px solid #f7d84a;
}
.gg-logo { width: 28px; height: 28px; }
.title { font-family: 'Bangers', cursive; letter-spacing: 2px; color: #f7d84a; font-size: 20px; }
.exit-btn {
  margin-left: auto; background: #00000022; color: #f7d84a; border: 1px solid #f7d84a66;
  border-radius: 4px; padding: 5px 14px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 11px;
}
.exit-btn:hover { background: #f7d84a22; }
.screen { position: fixed; top: 42px; left: 0; right: 0; bottom: 0; display: flex; }
.hidden { display: none !important; }
#title-screen {
  align-items: center; justify-content: center; flex-direction: column; text-align: center; gap: 18px;
  background:
    radial-gradient(circle at 25% 20%, #f74a6a33 0, transparent 24%),
    radial-gradient(circle at 80% 70%, #39d9ff2b 0, transparent 28%),
    linear-gradient(135deg, #17171f, #22210f 52%, #12121a);
}
h1 {
  font-family: 'Bangers', cursive; font-size: clamp(54px, 12vw, 116px); letter-spacing: 3px;
  color: #f7d84a; text-shadow: 5px 5px 0 #f74a6a, -3px -3px 0 #39d9ff, 0 0 26px #f7d84a66;
}
.subtitle { max-width: 720px; color: #f1f1d0; padding: 0 20px; line-height: 1.5; }
.menu-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.chaos-btn {
  border: 2px solid #f7d84a; color: #101014; background: #f7d84a;
  font-family: 'Bangers', cursive; font-size: 22px; letter-spacing: 1px; padding: 12px 28px;
  border-radius: 7px; cursor: pointer; box-shadow: 0 6px 0 #9f7d12;
}
.chaos-btn.secondary { background: #111114; color: #f7d84a; box-shadow: none; }
.chaos-btn:hover { transform: translateY(-2px); }
#game-screen { background: #07080b; }
#arena { width: 100%; height: 100%; display: block; }
#hud {
  position: fixed; top: 50px; left: 12px; right: 12px; z-index: 20; pointer-events: none;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
}
.hud-panel {
  background: #00000099; border: 1px solid #ffffff22; border-radius: 7px; padding: 9px 12px;
  backdrop-filter: blur(4px); box-shadow: 0 4px 18px #00000055;
}
.hud-panel.right { justify-self: end; text-align: right; }
.big-stat { font-family: 'Bangers', cursive; font-size: 22px; color: #f7d84a; letter-spacing: 1px; }
.small-stat { font-size: 12px; color: #d8d8d8; line-height: 1.45; }
#crosshair {
  position: fixed; top: 50%; left: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%);
  z-index: 25; pointer-events: none;
}
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #ffffffdd; box-shadow: 0 0 8px #39d9ff; }
#crosshair::before { left: 12px; top: 0; width: 2px; height: 26px; }
#crosshair::after { top: 12px; left: 0; width: 26px; height: 2px; }
#weapon-bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25;
  display: flex; gap: 8px; background: #00000099; padding: 8px; border-radius: 7px; border: 1px solid #ffffff22;
}
.weapon-slot {
  width: 74px; min-height: 54px; border: 2px solid #ffffff22; border-radius: 6px; padding: 5px;
  text-align: center; font-size: 10px; color: #ccc; background: #101014cc;
}
.weapon-slot.active { border-color: #f7d84a; box-shadow: 0 0 14px #f7d84a55; color: #fff; }
.weapon-emoji { display: block; font-size: 23px; line-height: 23px; margin-bottom: 2px; }
#damage-flash {
  position: fixed; inset: 0; z-index: 21; pointer-events: none;
  background: radial-gradient(circle, transparent 45%, #ff1c3c66); opacity: 0; transition: opacity 0.12s;
}
#center-msg {
  position: fixed; top: 44%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
  font-family: 'Bangers', cursive; font-size: 36px; color: #f7d84a; text-shadow: 3px 3px 0 #000;
  pointer-events: none; opacity: 0; transition: opacity 0.2s; text-align: center;
}
#overlay {
  position: fixed; top: 42px; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center; padding: 18px; background: #000000c8;
}
.panel {
  width: min(960px, 100%); max-height: 86vh; overflow-y: auto;
  background: linear-gradient(135deg, #181820, #24220f); border: 2px solid #f7d84a;
  border-radius: 8px; padding: 18px; box-shadow: 0 0 40px #000;
}
.panel h2 { font-family: 'Bangers', cursive; color: #f7d84a; font-size: 42px; letter-spacing: 2px; margin-bottom: 8px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
.shop-card {
  background: #00000055; border: 1px solid #ffffff22; border-radius: 7px; padding: 12px;
  min-height: 150px; display: flex; flex-direction: column; gap: 7px;
}
.shop-name { font-family: 'Bangers', cursive; font-size: 22px; color: #fff; }
.shop-desc { color: #cfcfcf; font-size: 12px; line-height: 1.35; flex: 1; }
.shop-buy {
  border: 1px solid #f7d84a; background: #f7d84a22; color: #f7d84a; border-radius: 4px;
  padding: 7px; cursor: pointer; font-family: 'Bangers', cursive; font-size: 16px;
}
.shop-buy:disabled { opacity: 0.4; cursor: default; }
.toast {
  position: fixed; right: 14px; bottom: 90px; z-index: 60; background: #111114ee;
  border: 1px solid #f7d84a; color: #f7d84a; padding: 10px 14px; border-radius: 6px;
  font-family: 'Bangers', cursive; letter-spacing: 1px; transform: translateX(120%); transition: transform 0.25s;
}
.toast.show { transform: translateX(0); }
body.embedded #toolbar { display: none; }
body.embedded .screen { top: 0; }
body.embedded #overlay { top: 0; }
@media (max-width: 600px) {
  #hud { grid-template-columns: 1fr; right: auto; width: calc(100% - 24px); }
  .hud-panel.right { justify-self: stretch; text-align: left; }
  #weapon-bar { left: 8px; right: 8px; transform: none; overflow-x: auto; justify-content: flex-start; }
  .weapon-slot { min-width: 68px; }
}
</style>
</head>
<body>
<div id="toolbar">
  <svg class="gg-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#0a0a0f"/><text x="16" y="22" text-anchor="middle" font-family="serif" font-weight="bold" font-size="15" fill="#c9a84c">GG</text></svg>
  <div class="title">DUMB CHAOS</div>
  <button class="exit-btn" onclick="location.href='../index.html'">EXIT TO LAUNCHER</button>
</div>

<section id="title-screen" class="screen">
  <h1>DUMB CHAOS</h1>

  <div class="menu-row">
    <button class="chaos-btn" onclick="startGame()">CREATE CHAOS</button>
    <button class="chaos-btn secondary" onclick="openCustomize()">CUSTOM LOOK + WEAPON SELECT</button>
    <button class="chaos-btn secondary" onclick="openShop()">GOOFY SHOP</button>
  </div>
  <p class="small-stat" id="title-stats"></p>
</section>

<section id="game-screen" class="screen hidden">
  <canvas id="arena"></canvas>
  <div id="hud">
    <div class="hud-panel">
      <div class="big-stat" id="health-stat">HP 100</div>
      <div class="small-stat" id="match-stat">Kills 0 | Streak 0 | Wave 1</div>
    </div>
    <div class="hud-panel">
      <div class="big-stat" id="coin-stat">0 CHAOS COINS</div>
      <div class="small-stat">WASD move | Space jump | Mouse aim | Click fire | 1-5 weapons | R shop</div>
    </div>
    <div class="hud-panel right">
      <div class="big-stat" id="weapon-stat">Pineapple Launcher</div>
      <div class="small-stat" id="ammo-stat">Ready</div>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="weapon-bar"></div>
  <div id="damage-flash"></div>
  <div id="center-msg"></div>
</section>

<div id="overlay" class="hidden"></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../gg-supabase.js"></script>
<script>
const SAVE_KEY = 'dumb-chaos-save';
const DC_GG_KEY = 'graham-games-data';
if (window.self !== window.top) document.body.classList.add('embedded');

  { id: 'dc_streak_5', name: 'Five Alarm Chaos', reward: 20 },
  { id: 'dc_big_money', name: 'Coin Gobbler', reward: 20 },

  { id: 'dc_chaos_king', name: 'Chaos King', reward: 50 },
];
const WEAPONS = [
  { id: 'pineapple', name: 'Pineapple Launcher', emoji: 'P', cost: 0, cooldown: 0.7, damage: 38, speed: 22, splash: 3.1, color: 0xf7d84a, projectile: 'pineapple' },
  { id: 'rubber', name: 'Rubber Chicken Slapper', emoji: 'C', cost: 60, cooldown: 0.25, damage: 12, speed: 32, splash: 0, color: 0xff6a2a, projectile: 'chicken' },
  { id: 'waffle', name: 'Waffle Mine Tosser', emoji: 'W', cost: 90, cooldown: 1.1, damage: 65, speed: 14, splash: 4.2, color: 0xc98935, projectile: 'waffle' },
  { id: 'toilet', name: 'Poo & Pee Toilet Cannon', emoji: 'T', cost: 40, cooldown: 0.55, damage: 24, speed: 20, splash: 1.8, color: 0xffffff, projectile: 'toilet' },
  { id: 'catball', name: 'Bouncy Ball Cat Cannon', emoji: 'K', cost: 1250, cooldown: 1.0, damage: 72, speed: 28, splash: 3.8, color: 0xff66aa, projectile: 'catball' },

  { id: 'speedShoes', name: 'Slippy Speed Shoes', cost: 450, desc: 'Move faster while causing problems.' },
  { id: 'biggerBooms', name: 'Bigger Booms', cost: 700, desc: 'Splash weapons get wider explosions.' },

  { id: 'springyPants', name: 'Springy Pants', cost: 550, desc: 'Jump higher with maximum nonsense bounce.' },
  { id: 'snackTax', name: 'Snack Tax Permit', cost: 650, desc: 'Rival splats drop a few extra Chaos Coins.' },

  { id: 'sockCannonGrease', name: 'Sock Cannon Grease', cost: 500, desc: 'All goofy weapons reload slightly faster.' },
];
const RIVAL_NAMES = ['ToastWizard', 'NoodleNinja', 'SirTripsALot', 'BucketMode', 'SnackBandit', 'WaffleDad'];
const BOT_NAMES = ['Chaos Bot', 'Wobble Bot', 'Goof Drone', 'Bonk Unit', 'Splat Machine', 'Dummy Droid', 'Panic Bot', 'Snack Bot', 'Noodle Bot', 'Bucket Bot'];
const DC_SKINS = [0xffcc99, 0xf1b57a, 0xd4935f, 0x8d5524, 0x5c351c, 0x3a2517];
const DC_HAIR = [0x2b1b12, 0x6b3f21, 0xd6a13a, 0x111111, 0xb66a2c, 0xf0d060];
const CAT_COLORS = [0xff66aa, 0x39d9ff, 0xf7d84a, 0x77dd44, 0xb987ff, 0xff8a3d, 0xf1f1f1, 0x222226];
const DC_OUTFITS = [
  { name: 'Casual Blue', shirt: 0x4488cc, pants: 0x334466, cost: 150 },
  { name: 'Sporty Red', shirt: 0xcc3333, pants: 0x222222, cost: 175 },
  { name: 'Forest Green', shirt: 0x338844, pants: 0x3a3a2a, cost: 175 },
  { name: 'Pink Pop', shirt: 0xdd55aa, pants: 0xeeeedd, cost: 200 },
  { name: 'Golden Drip', shirt: 0xccaa33, pants: 0x1a1a1a, cost: 275 },
  { name: 'GG Merch', shirt: 0xcc2222, pants: 0x1a1a1a, cost: 200 },
  { name: 'Pizza Pajamas', shirt: 0xffb347, pants: 0x7b4a22, cost: 190 },
  { name: 'Cosmic Hoodie', shirt: 0x2f2d8f, pants: 0x111133, cost: 240 },
  { name: 'Slime Suit', shirt: 0x77dd44, pants: 0x2c5f2d, cost: 225 },
  { name: 'Cardboard Hero', shirt: 0xb78752, pants: 0x60422a, cost: 160 },
  { name: 'Neon Zebra', shirt: 0xf1f1f1, pants: 0x111111, cost: 300 },
  { name: 'Royal Purple', shirt: 0x8b3fd9, pants: 0xf7d84a, cost: 325 },
];
const DC_HATS = [
  { id: 'none', name: 'No Hat', cost: 0, color: 0x000000 },
  { id: 'cone', name: 'Traffic Cone', cost: 50, color: 0xff7a1a },
  { id: 'bucket', name: 'Bucket Hat', cost: 70, color: 0xbfc6cc },
  { id: 'crown', name: 'Tiny Crown', cost: 125, color: 0xf7d84a },
  { id: 'propeller', name: 'Propeller Cap', cost: 110, color: 0x39d9ff },
];

let scene, camera, renderer, clock;
let player, keys = {}, yaw = 0, pitch = 0, locked = false;
let enemies = [], projectiles = [], pickups = [], chaosProps = [];
let state = loadGame();
let currentWeapon = state.equipped || 'pineapple';
let cooldown = 0, spawnTimer = 0, wave = 1, matchKills = 0, streak = 0, bossSpawned = false;
let weaponView = null, weaponRecoil = 0, walkBob = 0;
let customizeRenderer = null, customizeScene = null, customizeCamera = null, customizeChar = null, customizeAnim = null;
let matchCountdown = 0, knockoutCountdown = 0, playerOut = false;
let activeEnemyNames = new Set();
let toiletShotToggle = false;
let nextCatColorIndex = 0;

function defaultSave() {
  return {
    coins: 0, totalCoins: 0, totalKills: 0, botKills: 0, playerKills: 0, bestStreak: 0,
    ownedWeapons: { pineapple: true }, upgrades: {}, equipped: 'pineapple', bossKills: 0,
    ownedOutfits: { 0: true },
    ownedHats: { none: true },
    appearance: { skin: 1, hair: 1, hairStyle: 'short', outfit: 0, hat: 'none' }
  };
}
function loadGame() {
  try {
    const loaded = Object.assign(defaultSave(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {});
    loaded.appearance = Object.assign(defaultSave().appearance, loaded.appearance || {});
    loaded.ownedWeapons = Object.assign({ pineapple: true }, loaded.ownedWeapons || {});
    loaded.ownedOutfits = Object.assign({ 0: true }, loaded.ownedOutfits || {});
    loaded.ownedHats = Object.assign({ none: true }, loaded.ownedHats || {});
    loaded.upgrades = Object.assign({}, loaded.upgrades || {});
    return loaded;
  }
  catch(e) { return defaultSave(); }
}
function saveGame() {
  state.equipped = currentWeapon;
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}
function ggData() {
  try { return JSON.parse(localStorage.getItem(DC_GG_KEY)) || { gBux: 0, achievements: {}, shopPurchases: {} }; }
  catch(e) { return { gBux: 0, achievements: {}, shopPurchases: {} }; }
}
function fallbackUnlock(id, name, reward) {
  const data = ggData();
  if (data.achievements[id]) return false;
  data.achievements[id] = true;
  data.gBux += reward;
  localStorage.setItem(DC_GG_KEY, JSON.stringify(data));
  return true;
}
function unlock(id) {
  const ach = DC_ACH.find(a => a.id === id);
  if (!ach) return;
  const unlocked = window.ggUnlockAchievement ? window.ggUnlockAchievement(id, ach.name, ach.reward) : fallbackUnlock(id, ach.name, ach.reward);
  if (unlocked !== false) toast('ACHIEVEMENT: ' + ach.name + ' +' + ach.reward + 'G');
}
function hasGgPurchase(id) {
  const data = window.ggLoad ? window.ggLoad() : ggData();
  return !!(data.shopPurchases && data.shopPurchases[id]);
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x84c9ff);
  scene.fog = new THREE.Fog(0x84c9ff, 35, 95);
  const toolbarOffset = document.body.classList.contains('embedded') ? 0 : 42;
  camera = new THREE.PerspectiveCamera(75, innerWidth / (innerHeight - toolbarOffset), 0.1, 160);
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('arena'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  clock = new THREE.Clock();
  player = { pos: new THREE.Vector3(0, 1.7, 12), vel: new THREE.Vector3(), hp: 100, maxHp: 100, onGround: true };
  buildArena();
  buildWeaponView();
  resize();
  addEventListener('resize', resize);
}
function buildArena() {
  scene.clear();
  const hemi = new THREE.HemisphereLight(0xffffff, 0x353535, 0.8);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(18, 28, 12); sun.castShadow = true; scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ color: 0x6d4c3d, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  addHouseRoomFloor(-22, -22, 34, 34, 0x7d5c8f, 'living room');
  addHouseRoomFloor(22, -22, 34, 34, 0x3f6f8f, 'kitchen');
  addHouseRoomFloor(-22, 22, 34, 34, 0x8f5b5b, 'bedroom');
  addRaisedFloor(22, 22, 34, 34, 1.25, 0x4f8f66, 'raised play room');
  addRaisedFloor(0, 0, 18, 18, 2.75, 0xb78752, 'upper hallway loft');
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xe7d9b4, roughness: 0.65 });
  addBox(0, 8, -45, 90, 16, 1, wallMat); addBox(0, 8, 45, 90, 16, 1, wallMat);
  addBox(-45, 8, 0, 1, 16, 90, wallMat); addBox(45, 8, 0, 1, 16, 90, wallMat);
  addHighRoof();
  addHouseWall(0, 8, -30, 1, 16, 24, 'living-kitchen wall');
  addHouseWall(0, 8, -4, 1, 16, 20, 'front hall wall');
  addHouseWall(0, 8, 21, 1, 16, 22, 'bed-play wall');
  addHouseWall(-31.5, 8, 0, 27, 16, 1, 'bedroom wall');
  addHouseWall(1, 8, 0, 30, 16, 1, 'center door wall');
  addHouseWall(32.5, 8, 0, 25, 16, 1, 'kitchen wall');
  addDoorFrame(0, -16, Math.PI / 2);
  addDoorFrame(0, 8, Math.PI / 2);
  addDoorFrame(-16, 0, 0);
  addDoorFrame(18, 0, 0);
  addFurnitureCover(-23, 2.8, -23, 10, 5.6, 3.2, 0x39d9ff, 'living room toy shelf', 'shelf');
  addFurnitureCover(20, 2.8, -24, 10, 5.6, 3.2, 0xf74a6a, 'kitchen counter', 'counter');
  addFurnitureCover(-23, 3.2, 22, 5, 6.4, 9, 0xf7d84a, 'bedroom dresser', 'dresser');
  addFurnitureCover(22, 3.2, 23, 5, 6.4, 9, 0x9b59ff, 'play room bunk bed', 'bunk');
  addFurnitureCover(0, 4, 30, 15, 8, 2.8, 0x2f3340, 'upstairs closet', 'closet');
  addFurnitureCover(0, 4, -30, 15, 8, 2.8, 0x6d4c3d, 'front door shoe rack', 'shoes');
  addStairs(13, 11, 1.25, 0x8b5a3c);
  addStairs(-10, -8, 2.75, 0x8b5a3c);
  addGoofyRoomStuff();
  makeBillboard('DUMB CHAOS HOUSE', 0, 5.4, -36, 0xf7d84a);
}
function addBox(x, y, z, w, h, d, mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh;
}
function addHouseRoomFloor(x, z, w, d, color, name) {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.82 });
  const floor = addBox(x, 0.04, z, w, 0.08, d, mat);
  floor.userData.name = name;
  return floor;
}
function addHighRoof() {
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x5a3a28, roughness: 0.72, transparent: true, opacity: 0.88 });
  addBox(0, 16.5, 0, 92, 0.7, 92, roofMat);
  const beamMat = new THREE.MeshStandardMaterial({ color: 0x3b2a1f, roughness: 0.62 });
  for (let z = -36; z <= 36; z += 18) addBox(0, 15.9, z, 88, 0.4, 0.5, beamMat);
  for (let x = -36; x <= 36; x += 18) addBox(x, 15.85, 0, 0.5, 0.36, 88, beamMat);
}
function addRaisedFloor(x, z, w, d, height, color, name) {
  const mesh = addClimbableBox(x, height / 2, z, w, height, d, color, name);
  mesh.userData.floorPlatform = true;
  return mesh;
}
function addHouseWall(x, y, z, w, h, d, name) {
  const mesh = addBox(x, y, z, w, h, d, new THREE.MeshStandardMaterial({ color: 0xe7d9b4, roughness: 0.62 }));
  mesh.userData.cover = true;
  mesh.userData.houseWall = true;
  mesh.userData.halfW = w / 2;
  mesh.userData.halfD = d / 2;
  mesh.userData.topY = y + h / 2;
  mesh.userData.name = name;
  chaosProps.push(mesh);
  return mesh;
}
function addDoorFrame(x, z, rot) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x6d4c3d, roughness: 0.55 });
  const frame = new THREE.Group();
  const left = new THREE.Mesh(new THREE.BoxGeometry(0.28, 4.8, 0.32), mat);
  left.position.set(-2, 2.4, 0);
  const right = left.clone(); right.position.x = 2;
  const top = new THREE.Mesh(new THREE.BoxGeometry(4.28, 0.32, 0.32), mat);

function updatePlayer(dt) {
  const speed = (state.upgrades.speedShoes ? 8.2 : 6.2) * (hasGgPurchase('dc_chaos_socks') ? 1.15 : 1);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() === 0) forward.set(0, 0, -1);
  forward.normalize();

  const moving = move.lengthSq() > 0;
  if (moving) move.normalize().multiplyScalar(speed * dt);
  player.pos.add(move);
  player.vel.y -= 18 * dt;
  player.pos.y += player.vel.y * dt;

    const minX = p.position.x - p.userData.halfW - radius;
    const maxX = p.position.x + p.userData.halfW + radius;
    const minZ = p.position.z - p.userData.halfD - radius;
    const maxZ = p.position.z + p.userData.halfD + radius;
    if (pos.x < minX || pos.x > maxX || pos.z < minZ || pos.z > maxZ) return;
    const left = Math.abs(pos.x - minX);
    const right = Math.abs(maxX - pos.x);
    const bottom = Math.abs(pos.z - minZ);
    const top = Math.abs(maxZ - pos.z);
    const m = Math.min(left, right, bottom, top);
    if (m === left) pos.x = minX;
    else if (m === right) pos.x = maxX;
    else if (m === bottom) pos.z = minZ;
    else pos.z = maxZ;
  });
}
function resolveClimbablePlayer() {
  let groundY = 1.7;
  chaosProps.forEach(p => {
    if (!p.userData.climbable) return;
    const withinX = Math.abs(player.pos.x - p.position.x) <= p.userData.halfW + 0.42;
    const withinZ = Math.abs(player.pos.z - p.position.z) <= p.userData.halfD + 0.42;
    const standingHeight = p.userData.topY + 1.7;
    const ladderBoost = p.userData.ladderCover && withinX && withinZ;
    if ((withinX && withinZ && player.pos.y >= standingHeight - 0.85) || ladderBoost) groundY = Math.max(groundY, standingHeight);
  });
  if (player.pos.y <= groundY) {
    player.pos.y = groundY;
    player.vel.y = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }
}
function hasLineOfSight(a, b) {
  return !chaosProps.some(p => p.userData.cover && segmentIntersectsCover(a, b, p));
}
function segmentIntersectsCover(a, b, cover) {
  const minX = cover.position.x - cover.userData.halfW;
  const maxX = cover.position.x + cover.userData.halfW;
  const minZ = cover.position.z - cover.userData.halfD;
  const maxZ = cover.position.z + cover.userData.halfD;
  const dx = b.x - a.x;
  const dz = b.z - a.z;
  let tMin = 0, tMax = 1;
  if (!clipSegmentAxis(a.x, dx, minX, maxX)) return false;
  const xClip = clipSegmentAxis(a.x, dx, minX, maxX);
  tMin = Math.max(tMin, xClip[0]); tMax = Math.min(tMax, xClip[1]);
  const zClip = clipSegmentAxis(a.z, dz, minZ, maxZ);
  if (!zClip) return false;
  tMin = Math.max(tMin, zClip[0]); tMax = Math.min(tMax, zClip[1]);
  return tMax >= tMin;
}
function clipSegmentAxis(start, delta, min, max) {
  if (Math.abs(delta) < 0.0001) return (start >= min && start <= max) ? [0, 1] : null;
  const t1 = (min - start) / delta;
  const t2 = (max - start) / delta;
  return [Math.min(t1, t2), Math.max(t1, t2)];
}
function spawnCoinBurst(pos, amount) {
  for (let i = 0; i < Math.min(8, Math.ceil(amount / 10)); i++) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0xf7d84a, emissive: 0x332200 }));
    mesh.position.copy(pos).add(new THREE.Vector3(rand(-0.8, 0.8), rand(0.5, 1.8), rand(-0.8, 0.8)));
    scene.add(mesh); pickups.push({ mesh, life: 1.8, vel: new THREE.Vector3(rand(-1.5, 1.5), rand(1, 3), rand(-1.5, 1.5)) });
  }
}
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.life -= dt; p.vel.y -= 5 * dt; p.mesh.position.add(p.vel.clone().multiplyScalar(dt)); p.mesh.rotation.y += 7 * dt;
    if (p.life <= 0) { scene.remove(p.mesh); pickups.splice(i, 1); }
  }
}

function popSfx(kind) {
  try {
    const ac = popSfx.ac || (popSfx.ac = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = kind === 'rubber' ? 'square' : 'triangle';
    osc.frequency.setValueAtTime(kind === 'pineapple' ? 160 : 260, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(kind === 'catball' ? 900 : 80, ac.currentTime + 0.12);
    gain.gain.setValueAtTime(0.08, ac.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);

  } catch(e) {}
}
