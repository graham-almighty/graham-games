let _passed = 0, _failed = 0, _currentGroup = '';
function group(name) { _currentGroup = name; }
function assert(cond, name) {
  const fullName = _currentGroup ? _currentGroup + ': ' + name : name;
  const div = document.createElement('div');
  if (cond) { div.className = 'test pass'; _passed++; }
  else { div.className = 'test fail'; _failed++; }
  div.textContent = (cond ? 'PASS' : 'FAIL') + ': ' + fullName;
  document.getElementById('results').appendChild(div);
}
function assertEqual(a, b, name) {
  assert(a === b, name + ' (expected ' + b + ', got ' + a + ')');
}
function assertApprox(a, b, eps, name) {
  assert(Math.abs(a - b) < eps, name + ' (expected ~' + b + ', got ' + a + ')');
}
function showSummary() {
  const div = document.createElement('div');
  div.className = 'summary';
  div.textContent = _passed + ' passed, ' + _failed + ' failed (' + (_passed + _failed) + ' total)';
  document.getElementById('results').appendChild(div);
}

// ═══ GRID HELPERS ═══
let grid, trailGrid;

function initGrid() {
  grid = [];
  trailGrid = [];
  for (let y = 0; y < GRID_H; y++) {
    grid[y] = new Array(GRID_W).fill(0);
    trailGrid[y] = new Array(GRID_W).fill(0);
  }
}

function placeStartTerritory(player, cx, cy) {
  const half = Math.floor(SPAWN_SIZE / 2);
  for (let dy = -half; dy <= half; dy++) {
    for (let dx = -half; dx <= half; dx++) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
        grid[ny][nx] = player.id;
      }
    }
  }
}

function countTerritory(id) {
  let count = 0;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] === id) count++;
    }
  }
  return count;
}

function captureTerritory(player) {
  const id = player.id;
  if (player.trail.length === 0) return 0;

  for (const t of player.trail) {
    grid[t.y][t.x] = id;
    trailGrid[t.y][t.x] = 0;
  }
  const trailLen = player.trail.length;
  player.trail = [];

  const visited = [];
  for (let y = 0; y < GRID_H; y++) visited[y] = new Array(GRID_W).fill(false);

  const stack = [];
  for (let x = 0; x < GRID_W; x++) {
    if (grid[0][x] !== id && !visited[0][x]) { visited[0][x] = true; stack.push(x, 0); }
    if (grid[GRID_H-1][x] !== id && !visited[GRID_H-1][x]) { visited[GRID_H-1][x] = true; stack.push(x, GRID_H-1); }
  }
  for (let y = 1; y < GRID_H - 1; y++) {
    if (grid[y][0] !== id && !visited[y][0]) { visited[y][0] = true; stack.push(0, y); }
    if (grid[y][GRID_W-1] !== id && !visited[y][GRID_W-1]) { visited[y][GRID_W-1] = true; stack.push(GRID_W-1, y); }
  }

  while (stack.length > 0) {
    const sy = stack.pop(), sx = stack.pop();
    for (let d = 0; d < 4; d++) {
      const nx = sx + DX[d], ny = sy + DY[d];
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
      if (visited[ny][nx] || grid[ny][nx] === id) continue;
      visited[ny][nx] = true;
      stack.push(nx, ny);
    }
  }

  let captured = 0;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (!visited[y][x] && grid[y][x] !== id) {
        grid[y][x] = id;
        captured++;
      }
    }
  }

  return captured + trailLen;
}

group('Trail and Capture - Simple Loop');
{
  initGrid();
  const p = { id: 1, trail: [] };
  // Place 3x3 territory at (10, 10)
  placeStartTerritory(p, 10, 10);
  assertEqual(countTerritory(1), 9, 'Starting territory is 9');

  // Create a trail that goes right, down, and back left to territory
  // Trail: (12,10) -> (13,10) -> (14,10) -> (14,11) -> (14,12) -> (13,12) -> (12,12) -> (11,12)
  const trailCells = [
    {x:12, y:10}, {x:13, y:10}, {x:14, y:10},
    {x:14, y:11}, {x:14, y:12},
    {x:13, y:12}, {x:12, y:12}, {x:11, y:12},
  ];
  for (const t of trailCells) {
    trailGrid[t.y][t.x] = 1;
    p.trail.push(t);
  }

  const captured = captureTerritory(p);
  assert(captured > 0, 'Capture returns positive count');

  // The trail cells should now be territory
  assert(grid[10][13] === 1, 'Trail cell became territory');
  assert(grid[12][14] === 1, 'Trail cell became territory');

  // The enclosed area (between trail and original territory) should be filled
  assert(grid[11][12] === 1, 'Enclosed cell became territory');
  assert(grid[11][13] === 1, 'Enclosed cell became territory');
}

group('Trail and Capture - No Loop (Straight Line)');
{
  initGrid();
  const p = { id: 1, trail: [] };
  placeStartTerritory(p, 60, 60);
  const before = countTerritory(1);

  // Straight trail going right (no loop back)
  // This trail connects from territory outward but returns to territory on the other end
  // Actually for a straight line that returns to territory, it won't enclose anything
  p.trail = [{x:62, y:60}, {x:63, y:60}, {x:64, y:60}];
  for (const t of p.trail) trailGrid[t.y][t.x] = 1;

  const captured = captureTerritory(p);
  // Trail cells become territory but no enclosed area
  const after = countTerritory(1);
  assertEqual(after, before + 3, 'Straight trail only adds trail cells, no enclosed area');
}

group('Trail Cleanup on Kill');
{
  initGrid();
  const p = { id: 1, trail: [{x:5, y:5}, {x:6, y:5}], alive: true, lives: 5 };
  trailGrid[5][5] = 1;
  trailGrid[5][6] = 1;

  // Simulate kill: remove trail, decrement lives
  for (const t of p.trail) trailGrid[t.y][t.x] = 0;
  p.trail = [];
  p.alive = false;
  p.lives--;

  assertEqual(trailGrid[5][5], 0, 'Trail cell 1 cleared');
  assertEqual(trailGrid[5][6], 0, 'Trail cell 2 cleared');
  assertEqual(p.trail.length, 0, 'Trail array emptied');
  assertEqual(p.alive, false, 'Player marked dead');
  assertEqual(p.lives, 4, 'Lives decremented to 4');
}

    p.lives--;
    assert(p.lives > 0, 'Still has lives after death ' + (i + 1));

  p.lives--;

  initGrid();
  grid[5][5] = 2;
  grid[5][6] = 2;
  grid[6][5] = 2;
  const deadPlayer = { id: 2, lives: 0 };
  // Simulate territory removal

    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] === deadPlayer.id) grid[y][x] = 0;

  assertEqual(countTerritory(2), 0, 'Dead player territory cleared');
}

group('Timer Win - Player Leads');
{
  initGrid();
  // Player 1 has more territory
  for (let y = 0; y < 50; y++)
    for (let x = 0; x < 50; x++) grid[y][x] = 1;
  // Bot (player 2) has less
  for (let y = 0; y < 20; y++)
    for (let x = 0; x < 20; x++) grid[y][x] = 2;

  const p1count = countTerritory(1);
  const p2count = countTerritory(2);
  assert(p1count > p2count, 'Player 1 has more territory than player 2');

  // Simulate timer logic
  const counts = [
    { id: 1, count: p1count },
    { id: 2, count: p2count },
  ];
  counts.sort((a, b) => b.count - a.count);
  const playerWins = counts[0].id === 1 && counts[0].count > counts[1].count;
  assert(playerWins, 'Player wins when they have most territory at timer');
}

group('Timer Loss - Tie');
{
  initGrid();
  // Equal territory
  for (let y = 0; y < 30; y++)
    for (let x = 0; x < 30; x++) grid[y][x] = 1;
  for (let y = 0; y < 30; y++)
    for (let x = 30; x < 60; x++) grid[y][x] = 2;

  const p1count = countTerritory(1);
  const p2count = countTerritory(2);
  assertEqual(p1count, p2count, 'Territory is tied');

  const counts = [
    { id: 1, count: p1count },
    { id: 2, count: p2count },
  ];
  counts.sort((a, b) => b.count - a.count);
  const playerWins = counts[0].id === 1 && counts[0].count > counts[1].count;
  assert(!playerWins, 'Player does not win on tie');
}

group('Timer Loss - Behind');
{
  initGrid();
  // Bot has more territory
  for (let y = 0; y < 20; y++)
    for (let x = 0; x < 20; x++) grid[y][x] = 1;
  for (let y = 0; y < 80; y++)
    for (let x = 0; x < 80; x++) if (grid[y][x] === 0) grid[y][x] = 2;

  const p1count = countTerritory(1);
  const p2count = countTerritory(2);
  assert(p2count > p1count, 'Bot has more territory');

  const counts = [
    { id: 1, count: p1count },
    { id: 2, count: p2count },
  ];
  counts.sort((a, b) => b.count - a.count);
  const playerWins = counts[0].id === 1 && counts[0].count > counts[1].count;
  assert(!playerWins, 'Player loses when behind at timer');
}

  const p2 = { id: 2, trail: [] };
  placeStartTerritory(p1, 10, 10);
  // Place p2 territory inside where p1's capture loop will enclose
  grid[11][12] = 2;
  grid[11][13] = 2;

  // Create enclosing trail for p1
  const trailCells = [
    {x:12, y:9}, {x:13, y:9}, {x:14, y:9},
    {x:14, y:10}, {x:14, y:11}, {x:14, y:12},

    p1.trail.push(t);

  // p2's cells inside the loop should now be p1's
  assertEqual(grid[11][12], 1, 'P2 territory overwritten by P1 capture');
  assertEqual(grid[11][13], 1, 'P2 territory overwritten by P1 capture (cell 2)');

const MIO_GAME_KEY = 'mio-game-save';

function saveGameState() {
  try {
    const state = {
      grid: grid, trailGrid: trailGrid,
      players: players.map(p => ({
        id: p.id, x: p.x, y: p.y, px: p.px, py: p.py,
        dir: p.dir, nextDir: p.nextDir, speed: p.speed,
        moveProgress: p.moveProgress, trail: p.trail,
        alive: p.alive, invulnTimer: p.invulnTimer,
        isBot: p.isBot, botTimer: p.botTimer, botTargetDir: p.botTargetDir,
        territoryCount: p.territoryCount, lives: p.lives, shieldTimer: p.shieldTimer
      })),
      gameTime: gameTime, kills: kills, hasDied: hasDied,
      hasCapturedAfterDeath: hasCapturedAfterDeath,
      maxTerritory: maxTerritory, ioBuxEarnedThisGame: ioBuxEarnedThisGame
    };
    localStorage.setItem(MIO_GAME_KEY, JSON.stringify(state));
    return true;
  } catch(e) { return false; }
}

function loadGameState() {
  try {
    const s = JSON.parse(localStorage.getItem(MIO_GAME_KEY));
    if (!s || !s.grid) return null;
    return s;
  } catch { return null; }
}

group('Spawn Safety');
{
  initGrid();
  // Fill a large area with player 1 territory
  for (let y = 20; y < 80; y++) {
    for (let x = 20; x < 80; x++) {
      grid[y][x] = 1;
    }
  }

  // isSpawnClear should reject spots inside territory
  // Check center (50,50) - definitely in player 1's territory
  let clear = true;
  const half = Math.floor(SPAWN_SIZE / 2);
  for (let dy = -half - 2; dy <= half + 2; dy++) {
    for (let dx = -half - 2; dx <= half + 2; dx++) {
      const nx = 50 + dx, ny = 50 + dy;
      if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
        if (grid[ny][nx] !== 0 && grid[ny][nx] !== 2) { clear = false; break; }
      }
    }
    if (!clear) break;
  }
  assert(!clear, 'Spawn in occupied territory is not clear');

  // Check corner (5,5) - should be clear
  let cornerClear = true;
  for (let dy = -half - 2; dy <= half + 2; dy++) {
    for (let dx = -half - 2; dx <= half + 2; dx++) {
      const nx = 5 + dx, ny = 5 + dy;
      if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
        if (grid[ny][nx] !== 0 && grid[ny][nx] !== 2) { cornerClear = false; break; }
      }
    }
    if (!cornerClear) break;
  }
  assert(cornerClear, 'Spawn in empty corner is clear');
}
